name: Update rates

on:
  schedule:
    - cron: "15 */8 * * *" # 3x/day: sp-today free plan allows 100 requests/month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/update-rates.mjs
        env:
          SPTODAY_API_KEY: ${{ secrets.SPTODAY_API_KEY }}
      - name: Commit if changed
        run: |
          git config user.name "rates-bot"
          git config user.email "rates-bot@users.noreply.github.com"
          git add rates.json
          git diff --cached --quiet || (git commit -m "Update rates" && git push)
