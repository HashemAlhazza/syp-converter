<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SYP Converter</title>
<meta name="description" content="USD to new and old Syrian pound (official and street rates) and Egyptian pound.">
<meta name="theme-color" content="#0f766e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SYP">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<script>try{var t=localStorage.getItem("syp-theme");if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
<style>
:root{
  --bg:#f4f6f5; --card:#ffffff; --text:#14201d; --muted:#5f6f6a; --line:#e2e8e6;
  --accent:#0f766e; --accent-soft:#e6f4f2; --on-accent:#ffffff; --warn:#b45309; --err:#b91c1c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1211; --card:#151d1b; --text:#e8efed; --muted:#93a39e; --line:#24302d;
    --accent:#2dd4bf; --accent-soft:#12302c; --on-accent:#062420; --warn:#f59e0b; --err:#f87171;
  }
}
:root[data-theme="dark"]{
    --bg:#0c1211; --card:#151d1b; --text:#e8efed; --muted:#93a39e; --line:#24302d;
    --accent:#2dd4bf; --accent-soft:#12302c; --on-accent:#062420; --warn:#f59e0b; --err:#f87171;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
main{max-width:520px;margin:0 auto;
  padding:calc(env(safe-area-inset-top) + 20px) 16px calc(env(safe-area-inset-bottom) + 32px)}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.hbtns{display:flex;gap:8px}
#theme{width:40px;padding:8px 0;font-size:17px}
h1{font-size:20px;margin:0;letter-spacing:-.01em}
button{font:inherit;border:0;background:var(--accent-soft);color:var(--accent);
  padding:8px 14px;border-radius:999px;font-weight:600}
button:active{opacity:.7}
.input{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 18px;
  display:flex;align-items:center;gap:8px}
.input{margin-bottom:14px}
.input:focus-within{border-color:var(--accent)}
.input .cur{width:116px;flex:none;display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--muted)}
.input input,.input output{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--text);
  font:inherit;font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.flag{width:27px;height:18px;border-radius:3px;flex:none;box-shadow:0 0 0 1px var(--line)}
.input.out{background:var(--accent-soft);border-color:transparent}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;background:transparent;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--on-accent)}
.using{font-size:13px;color:var(--muted);text-align:center;margin:12px 0 20px}
.card{margin-top:24px}
.row .val{font-size:18px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px;margin-bottom:16px}
.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 14px;
  display:flex;justify-content:space-between;gap:8px}
.card h2 em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:500}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0 4px}
.meta + .row{border-top:1px solid var(--line);margin-top:14px;padding-top:16px}
.row .label{color:var(--muted);font-size:14px}
.row .val{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right;word-break:break-all}
.row .val small{font-size:14px;font-weight:600;color:var(--muted)}
.meta{font-size:12px;line-height:1.6;color:var(--muted);margin-top:4px}
.meta.warn{color:var(--warn)} .meta.err{color:var(--err)}
.street{border-color:var(--accent)}
footer{font-size:12px;color:var(--muted);text-align:center;margin-top:24px}
.offline{display:none;background:var(--warn);color:#fff;font-size:13px;font-weight:600;text-align:center;
  border-radius:12px;padding:8px 12px;margin-bottom:16px}
body.is-offline .offline{display:block}
</style>
</head>
<body>
<main>
  <header>
    <h1>SYP Converter</h1>
    <div class="hbtns">
      <button id="theme" type="button" aria-label="Switch light or dark mode">☀︎</button>
      <button id="refresh" type="button">Refresh</button>
    </div>
  </header>

  <div class="offline">Offline. Showing last saved rates.</div>
  <div class="seg" role="tablist">
    <button type="button" id="mStreet" class="on">Street rate</button>
    <button type="button" id="mOff">Central bank</button>
  </div>
  <div class="using" id="using">…</div>

  <label class="input"><span class="cur"><svg class="flag" viewBox="0 0 24 16" aria-hidden="true"><rect width="24" height="16" fill="#fff"/><rect y="0.00" width="24" height="1.23" fill="#b22234"/><rect y="2.46" width="24" height="1.23" fill="#b22234"/><rect y="4.92" width="24" height="1.23" fill="#b22234"/><rect y="7.38" width="24" height="1.23" fill="#b22234"/><rect y="9.85" width="24" height="1.23" fill="#b22234"/><rect y="12.31" width="24" height="1.23" fill="#b22234"/><rect y="14.77" width="24" height="1.23" fill="#b22234"/><rect width="10" height="8.62" fill="#3c3b6e"/><circle cx="1.2" cy="1.00" r=".42" fill="#fff"/><circle cx="3.0" cy="1.00" r=".42" fill="#fff"/><circle cx="4.8" cy="1.00" r=".42" fill="#fff"/><circle cx="6.6" cy="1.00" r=".42" fill="#fff"/><circle cx="8.4" cy="1.00" r=".42" fill="#fff"/><circle cx="2.1" cy="2.65" r=".42" fill="#fff"/><circle cx="3.9" cy="2.65" r=".42" fill="#fff"/><circle cx="5.7" cy="2.65" r=".42" fill="#fff"/><circle cx="7.5" cy="2.65" r=".42" fill="#fff"/><circle cx="1.2" cy="4.30" r=".42" fill="#fff"/><circle cx="3.0" cy="4.30" r=".42" fill="#fff"/><circle cx="4.8" cy="4.30" r=".42" fill="#fff"/><circle cx="6.6" cy="4.30" r=".42" fill="#fff"/><circle cx="8.4" cy="4.30" r=".42" fill="#fff"/><circle cx="2.1" cy="5.95" r=".42" fill="#fff"/><circle cx="3.9" cy="5.95" r=".42" fill="#fff"/><circle cx="5.7" cy="5.95" r=".42" fill="#fff"/><circle cx="7.5" cy="5.95" r=".42" fill="#fff"/><circle cx="1.2" cy="7.60" r=".42" fill="#fff"/><circle cx="3.0" cy="7.60" r=".42" fill="#fff"/><circle cx="4.8" cy="7.60" r=".42" fill="#fff"/><circle cx="6.6" cy="7.60" r=".42" fill="#fff"/><circle cx="8.4" cy="7.60" r=".42" fill="#fff"/></svg>USD</span>
    <input id="usd" type="text" inputmode="decimal" autocomplete="off" value="1" aria-label="US dollars"></label>
  <label class="input"><span class="cur"><svg class="flag" viewBox="0 0 24 16" aria-hidden="true"><rect width="24" height="16" fill="#fff"/><rect width="24" height="5.33" fill="#007a3d"/><rect y="10.67" width="24" height="5.33" fill="#000"/><polygon fill="#ce1126" points="6,6.2 6.59,7.99 8.47,7.99 6.9399999999999995,9.1 7.53,10.9 6,9.79 4.47,10.9 5.0600000000000005,9.1 3.53,7.99 5.41,7.99"/><polygon fill="#ce1126" points="12,6.2 12.59,7.99 14.47,7.99 12.94,9.1 13.53,10.9 12,9.79 10.47,10.9 11.06,9.1 9.53,7.99 11.41,7.99"/><polygon fill="#ce1126" points="18,6.2 18.59,7.99 20.47,7.99 18.94,9.1 19.53,10.9 18,9.79 16.47,10.9 17.06,9.1 15.53,7.99 17.41,7.99"/></svg>New SYP</span>
    <input id="nsyp" type="text" inputmode="decimal" autocomplete="off" aria-label="New Syrian pounds"></label>
  <label class="input"><span class="cur"><svg class="flag" viewBox="0 0 24 16" aria-hidden="true"><rect width="24" height="16" fill="#fff"/><rect width="24" height="5.33" fill="#007a3d"/><rect y="10.67" width="24" height="5.33" fill="#000"/><polygon fill="#ce1126" points="6,6.2 6.59,7.99 8.47,7.99 6.9399999999999995,9.1 7.53,10.9 6,9.79 4.47,10.9 5.0600000000000005,9.1 3.53,7.99 5.41,7.99"/><polygon fill="#ce1126" points="12,6.2 12.59,7.99 14.47,7.99 12.94,9.1 13.53,10.9 12,9.79 10.47,10.9 11.06,9.1 9.53,7.99 11.41,7.99"/><polygon fill="#ce1126" points="18,6.2 18.59,7.99 20.47,7.99 18.94,9.1 19.53,10.9 18,9.79 16.47,10.9 17.06,9.1 15.53,7.99 17.41,7.99"/></svg>Old SYP</span>
    <input id="osyp" type="text" inputmode="decimal" autocomplete="off" aria-label="Old Syrian pounds"></label>
  <div class="input out"><span class="cur"><svg class="flag" viewBox="0 0 24 16" aria-hidden="true"><rect width="24" height="16" fill="#fff"/><rect width="24" height="5.33" fill="#ce1126"/><rect y="10.67" width="24" height="5.33" fill="#000"/><path d="M12 6.1c-.5 0-.8.4-.8.8l-.9.3.4 2.4h2.6l.4-2.4-.9-.3c0-.4-.3-.8-.8-.8z" fill="#c09300"/></svg>EGP</span><output id="egp">–</output></div>

  <section class="card">
    <h2>Rates for $1</h2>
    <div class="row"><span class="label">Street (buy – sell)</span><span class="val" id="streetRate">…</span></div>
    <div class="meta" id="streetMeta">Loading…</div>
    <div class="row"><span class="label">Central bank</span><span class="val" id="offRate">…</span></div>
    <div class="meta" id="offMeta">Loading…</div>
    <div class="row"><span class="label">Egyptian pound</span><span class="val" id="egpRate">…</span></div>
    <div class="meta" id="egpMeta">Loading…</div>
  </section>

  <footer id="foot">Old SYP = New SYP × 100</footer>
</main>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var rates = { street:null, official:null, egp:null };
  var CACHE_KEY = "syp-rates-v1";

  function store(get, val){
    try { return get ? JSON.parse(localStorage.getItem(CACHE_KEY) || "null") : localStorage.setItem(CACHE_KEY, JSON.stringify(val)); }
    catch(e){ return null; }
  }

  function fmt(n, d){
    if (n == null || !isFinite(n)) return "–";
    return n.toLocaleString("en-US", { maximumFractionDigits: d == null ? 2 : d, minimumFractionDigits: 0 });
  }
  function ago(iso){
    if (!iso) return "";
    var t = new Date(iso), s = (Date.now() - t) / 1000;
    var rel = s < 90 ? "just now" : s < 3600 ? Math.round(s/60) + " min ago" : s < 86400 ? Math.round(s/3600) + " h ago" : Math.round(s/86400) + " days ago";
    return t.toLocaleString([], { dateStyle:"medium", timeStyle:"short" }) + " (" + rel + ")";
  }
  var mode = "street", src = "usd", srcVal = 1;
  try { mode = localStorage.getItem("syp-mode") || "street"; } catch(e){}
  function num(v){ var n = parseFloat(String(v).replace(/,/g, "")); return isFinite(n) ? n : null; }
  function rate(){
    if (mode === "street") return rates.street ? rates.street.buy : null;
    return rates.official ? rates.official.mid : null;
  }

  function render(){
    var s = rates.street, o = rates.official, e = rates.egp, r = rate();
    $("mStreet").className = mode === "street" ? "on" : "";
    $("mOff").className = mode === "street" ? "" : "on";
    $("using").textContent = r ? "Using $1 = " + fmt(r) + " new SYP" + (mode === "street" ? " (shop buy rate)" : " (central bank)") : "Rate unavailable";
    $("streetRate").textContent = s ? fmt(s.buy) + (s.sell && s.sell !== s.buy ? " – " + fmt(s.sell) : "") : "unavailable";
    $("offRate").textContent = o ? fmt(o.mid) : "unavailable";
    $("egpRate").textContent = e ? fmt(e.rate) : "unavailable";

    var usd = null;
    if (srcVal != null && r){
      usd = src === "usd" ? srcVal : src === "nsyp" ? srcVal / r : srcVal / 100 / r;
    }
    var vals = { usd: usd, nsyp: usd != null ? usd * r : null, osyp: usd != null ? usd * r * 100 : null };
    ["usd", "nsyp", "osyp"].forEach(function(id){
      if (id === src) return;
      $(id).value = vals[id] == null ? "" : fmt(vals[id], id === "osyp" ? 0 : 2);
    });
    $("egp").textContent = usd != null && e ? fmt(usd * e.rate) : "–";
  }

  function meta(id, r, label, status){
    var el = $(id);
    el.className = "meta" + (status ? " " + status : "");
    el.textContent = r ? label + " · " + (r.source || "") + " · " + ago(r.updated) : label;
  }

  function withTimeout(p, ms){
    return Promise.race([p, new Promise(function(_, rej){ setTimeout(function(){ rej(new Error("timeout")); }, ms); })]);
  }
  function getJSON(url){ return fetch(url, { cache:"no-store" }).then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); }); }
  function getText(url){ return fetch(url, { cache:"no-store" }).then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); }); }

  function toNewSyp(n){
    if (!isFinite(n) || n <= 0) return null;
    if (n > 1000) n = n / 100;
    return n > 30 && n < 1000 ? Math.round(n * 100) / 100 : null;
  }

  // rates.json is refreshed 3x a day by a GitHub Action. Read it from raw GitHub (fresher than Pages cache).
  function ratesJsonUrl(){
    var h = location.hostname.match(/^([^.]+)\.github\.io$/);
    var repo = location.pathname.split("/").filter(Boolean)[0];
    if (h && repo) return "https://raw.githubusercontent.com/" + h[1] + "/" + repo + "/main/rates.json?t=" + Date.now();
    return "rates.json?t=" + Date.now();
  }

  var loading = false;
  function load(){
    if (loading) return; loading = true;
    $("refresh").textContent = "…";
    var now = new Date().toISOString();

    var backup = withTimeout(getJSON(ratesJsonUrl()), 8000).catch(function(){ return null; });

    var pOfficial = withTimeout(getJSON("https://open.er-api.com/v6/latest/USD"), 8000).then(function(j){
      var upd = new Date(j.time_last_update_unix * 1000).toISOString();
      var off = toNewSyp(j.rates.SYP);
      if (off) { rates.official = { mid: off, source: "open.er-api.com", updated: upd }; meta("offMeta", rates.official, "Live, source updates daily"); }
      if (j.rates.EGP) { rates.egp = { rate: j.rates.EGP, source: "open.er-api.com", updated: upd }; meta("egpMeta", rates.egp, "Live, source updates daily"); }
      if (!off) throw new Error("no SYP");
    }).catch(function(){
      return backup.then(function(b){
        if (b && b.official){ rates.official = b.official; meta("offMeta", b.official, "Backup", "warn"); }
        else if (rates.official) meta("offMeta", rates.official, "Offline, last saved", "err");
        else meta("offMeta", null, "Could not load rate", "err");
        if (b && b.egp){ rates.egp = b.egp; meta("egpMeta", b.egp, "Backup", "warn"); }
        else if (rates.egp) meta("egpMeta", rates.egp, "Offline, last saved", "err");
        else meta("egpMeta", null, "Could not load rate", "err");
      });
    });

    var pStreet = backup.then(function(b){
      if (b && b.street){ rates.street = b.street; meta("streetMeta", b.street, "Damascus (buy – sell), updated 3× a day"); }
      else if (rates.street) meta("streetMeta", rates.street, "Offline, last saved", "err");
      else meta("streetMeta", null, "Could not load street rate", "err");
    });

    Promise.all([pOfficial, pStreet]).then(function(){
      document.body.classList.toggle("is-offline", !navigator.onLine);
      render(); store(false, rates);
      $("foot").textContent = "Checked " + new Date().toLocaleTimeString([], { timeStyle:"short" }) + " · Old SYP = New SYP × 100";
      loading = false; $("refresh").textContent = "Refresh";
    });
    pOfficial.then(render); pStreet.then(render);
  }

  // Show last saved rates instantly, then fetch fresh ones.
  var cached = store(true);
  if (cached){ rates = cached; render(); }
  try { localStorage.removeItem("syp-hist-v1"); } catch(e){}
  function onlineState(){ document.body.classList.toggle("is-offline", !navigator.onLine); }
  window.addEventListener("online", function(){ onlineState(); load(); });
  window.addEventListener("offline", onlineState);
  onlineState();
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function(){});

  ["usd", "nsyp", "osyp"].forEach(function(id){
    var el = $(id);
    el.addEventListener("input", function(){ src = id; srcVal = num(el.value); render(); });
    el.addEventListener("focus", function(){ el.select(); });
    el.addEventListener("blur", function(){ if (srcVal != null) el.value = fmt(srcVal, id === "osyp" ? 0 : 2); });
  });
  function setMode(m){ mode = m; try { localStorage.setItem("syp-mode", m); } catch(e){} render(); }
  $("mStreet").addEventListener("click", function(){ setMode("street"); });
  $("mOff").addEventListener("click", function(){ setMode("official"); });
  $("refresh").addEventListener("click", load);
  function isDark(){
    var t = document.documentElement.getAttribute("data-theme");
    return t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function themeIcon(){
    var d = isDark();
    $("theme").textContent = d ? "☀︎" : "☾";
    document.querySelector('meta[name="theme-color"]').setAttribute("content", d ? "#0c1211" : "#0f766e");
  }
  $("theme").addEventListener("click", function(){
    var t = isDark() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", t);
    try { localStorage.setItem("syp-theme", t); } catch(e){}
    themeIcon();
  });
  themeIcon();
  document.addEventListener("visibilitychange", function(){ if (!document.hidden) load(); });
  load();
})();
</script>
</body>
</html>
